  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:#cfc6d9; font-size:13.5px; font-weight:600; white-space:nowrap;\">Features<\u002Fa>\n      <a href=\"#how\" style=\"color:#cfc6d9; font-size:13.5px; font-weight:600; white-space:nowrap;\">How it works<\u002Fa>\n      <a href=\"#bartenders\" style=\"color:#cfc6d9; font-size:13.5px; font-weight:600; white-space:nowrap;\">Bartenders<\u002Fa>\n      <a href=\"#faq\" style=\"color:#cfc6d9; font-size:13.5px; font-weight:600; white-space:nowrap;\">FAQ<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"#notify\" style=\"flex-shrink:0; white-space:nowrap; padding:10px 18px; border-radius:{{ pillRadius }}; background:{{ grad90 }}; color:#fff; font-weight:700; font-size:13.5px; transition:transform .25s ease, box-shadow .25s ease;\" style-hover=\"transform:translateY(-2px) scale(1.03); box-shadow:0 10px 24px rgba(255,47,176,0.35);\">Notify me<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"position:relative; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:40px; padding:100px 64px 120px; max-width:1440px; margin:0 auto;\">\n    <div style=\"position:absolute; top:-120px; left:-120px; width:520px; height:520px; background:{{ blobA }}; filter:blur(20px); pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:absolute; bottom:-100px; right:0; width:480px; height:480px; background:{{ blobB }}; filter:blur(20px); pointer-events:none;\"><\u002Fdiv>\n\n    <div style=\"position:relative; z-index:1;\">\n      <div style=\"display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:100px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); font-size:13px; font-weight:700; letter-spacing:0.06em; color:{{ tintColor }}; margin-bottom:28px;\">\n        <span style=\"width: 8px; height: 8px; border-radius: 50%; background: rgb(226, 184, 255); display: inline-block; animation: 1.8s ease-in-out 0s infinite normal none running pulseDot;\"><\u002Fspan>\n        COMING SOON<\u002Fdiv>\n      <h1 style=\"font-size:60px; line-height:1.08; font-weight:800; margin:0 0 24px; letter-spacing:-0.02em;\">\n        Find your favorite bartenders.<br>\n        <span style=\"background:{{ grad90Smooth }}; background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmerText 8s ease-in-out infinite;\">Follow them. Tip them.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size:19px; line-height:1.6; color:#b7aec3; max-width:480px; margin:0 0 40px;\">\n        OnTap is making nightlife personal — you'll follow people, not just places. We're in the kitchen building it. Be first to know when it's ready.\n      <\u002Fp>\n      <div id=\"notify\" style=\"max-width:440px; margin-bottom:20px;\">\n        <sc-if value=\"{{ joined }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:12px; padding:16px 20px; border-radius:{{ btnRadius }}; background:rgba(226,184,255,0.1); border:1px solid rgba(226,184,255,0.3);\">\n            <span style=\"font-size:20px;\">🎉<\u002Fspan>\n            <span style=\"font-size:15px; font-weight:700; color:#f3eef7;\">You're on the list — we'll email you at launch.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notJoined }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display:flex; align-items:stretch; gap:10px;\">\n            <input type=\"email\" required=\"\" value=\"{{ emailValue }}\" sc-camel-on-change=\"{{ handleEmailChange }}\" placeholder=\"you@email.com\" style=\"flex:1; padding:15px 18px; border-radius:{{ btnRadius }}; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:#f3eef7; font-size:15px; font-family:inherit;\">\n            <button type=\"submit\" style=\"flex-shrink:0; padding:15px 26px; border-radius:{{ btnRadius }}; background:{{ grad90 }}; color:#fff; font-weight:700; font-size:15px; border:none; cursor:pointer; transition:transform .25s ease, box-shadow .25s ease;\" style-hover=\"transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,47,176,0.3);\">Notify me<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <p style=\"font-size:14px; color:#9a90a8; font-style:italic; margin:0;\">Built with bartenders, for the people behind the bar.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:28px;\">\n      <div style=\"animation:{{ floatAnim }}; width:300px; height:610px; border-radius:{{ phoneRadius }}; border:10px solid #17141d; background:linear-gradient(160deg,#1b1620,#0d0b12); box-shadow:{{ phoneGlow }}; overflow:hidden;\">\n        <image-slot id=\"hero-app-screen\" placeholder=\"App preview — map + bartender cards\" shape=\"rect\" style=\"width:100%; height:100%;\" src=\"bc1cf131-56cd-4ee4-80f3-25e419a498e9\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LOGO STRIP -->\n  <div style=\"border-top:1px solid rgba(255,255,255,0.06); border-bottom:1px solid rgba(255,255,255,0.06); padding:20px 0 28px; overflow:hidden;\">\n    <div style=\"text-align:center; font-size:12px; font-weight:700; letter-spacing:0.1em; color:#6b6274; margin-bottom:12px;\">LAUNCHING SOON IN<\u002Fdiv>\n    <div style=\"display:flex; width:max-content; gap:64px; opacity:0.5; animation:marqueeScroll 24s linear infinite;\">\n      <sc-for list=\"{{ cityList }}\" as=\"city\" hint-placeholder-count=\"6\">\n        <span style=\"font-size:14px; font-weight:700; letter-spacing:0.05em; color:#9a90a8; white-space:nowrap;\">{{ city }}<\u002Fspan>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ cityList }}\" as=\"city2\" hint-placeholder-count=\"6\">\n        <span style=\"font-size:14px; font-weight:700; letter-spacing:0.05em; color:#9a90a8; white-space:nowrap;\">{{ city2 }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FEATURES: CUSTOMERS -->\n  <div id=\"features\" style=\"padding:140px 64px; max-width:1280px; margin:0 auto;\">\n    <div style=\"text-align:center; max-width:640px; margin:0 auto 80px;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">FOR YOU<\u002Fdiv>\n      <h2 style=\"font-size:44px; font-weight:800; letter-spacing:-0.02em; margin:0 0 20px;\">Nightlife, but personal<\u002Fh2>\n      <p style=\"font-size:17px; color:#b7aec3; line-height:1.6; margin:0;\">You follow people, not just places.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:28px;\">\n      <sc-for list=\"{{ customerFeatures }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"\" style=\"padding:32px 28px; border-radius:{{ cardRadius }}; background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.08); opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease, border-color .3s ease, box-shadow .3s ease; transition-delay:calc({{ $index }} * 100ms);\" style-hover=\"transform:translateY(-8px); border-color:rgba(255,255,255,0.2); box-shadow:0 20px 40px rgba(0,0,0,0.35);\">\n          <div style=\"width:48px; height:48px; border-radius:{{ iconRadius }}; background:{{ grad135 }}; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:20px;\">{{ f.icon }}<\u002Fdiv>\n          <h3 style=\"font-size:19px; font-weight:700; margin:0 0 10px;\">{{ f.title }}<\u002Fh3>\n          <p style=\"font-size:14.5px; color:#b7aec3; line-height:1.6; margin:0;\">{{ f.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FEATURES: BARTENDERS -->\n  <div id=\"bartenders\" style=\"padding:140px 64px; background:rgba(255,255,255,0.02); border-top:1px solid rgba(255,255,255,0.06); border-bottom:1px solid rgba(255,255,255,0.06);\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div style=\"text-align:center; max-width:640px; margin:0 auto 80px;\">\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">FOR BARTENDERS<\u002Fdiv>\n        <h2 style=\"font-size:44px; font-weight:800; letter-spacing:-0.02em; margin:0 0 20px;\">Built for the ones behind the bar<\u002Fh2>\n        <p style=\"font-size:17px; color:#b7aec3; line-height:1.6; margin:0;\">No bartenders, nothing to discover. We built this for you first.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:28px;\">\n        <sc-for list=\"{{ bartenderFeatures }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div data-reveal=\"\" style=\"padding:32px 28px; border-radius:{{ cardRadius }}; background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.08); opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease, border-color .3s ease, box-shadow .3s ease; transition-delay:calc({{ $index }} * 100ms);\" style-hover=\"transform:translateY(-8px); border-color:rgba(255,255,255,0.2); box-shadow:0 20px 40px rgba(0,0,0,0.35);\">\n            <div style=\"width:48px; height:48px; border-radius:{{ iconRadius }}; background:{{ grad135 }}; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:20px;\">{{ f.icon }}<\u002Fdiv>\n            <h3 style=\"font-size:19px; font-weight:700; margin:0 0 10px;\">{{ f.title }}<\u002Fh3>\n            <p style=\"font-size:14.5px; color:#b7aec3; line-height:1.6; margin:0;\">{{ f.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TRUST -->\n  <div style=\"padding:120px 64px; max-width:1100px; margin:0 auto;\">\n    <div style=\"text-align:center; max-width:640px; margin:0 auto 64px;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">WHY IT'S DIFFERENT<\u002Fdiv>\n      <h2 style=\"font-size:40px; font-weight:800; letter-spacing:-0.02em; margin:0;\">Built with intent<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1.2fr 1fr; grid-template-rows:repeat(2,1fr); gap:24px;\">\n      <div data-reveal=\"\" style=\"grid-row:span 2; padding:44px; border-radius:{{ cardRadius }}; background:{{ gradCtaPanel }}; border:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; justify-content:center; opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease;\">\n        <div style=\"width:56px; height:56px; border-radius:{{ iconRadius }}; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:24px;\">🚫<\u002Fdiv>\n        <h3 style=\"font-size:30px; font-weight:800; margin:0 0 16px; letter-spacing:-0.01em; color:#fff;\">No DMs. No creeps.<\u002Fh3>\n        <p style=\"font-size:16px; color:rgba(255,255,255,0.75); line-height:1.7; margin:0;\">We built OnTap without direct messaging on purpose. It's a real safety net for the people behind the bar — many of them women — who are tired of being messaged by strangers.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"padding:32px; border-radius:{{ cardRadius }}; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:20px; opacity:0; transform:translateY(30px); transition:opacity .7s ease .1s, transform .7s ease .1s;\">\n        <div style=\"width:48px; height:48px; flex-shrink:0; border-radius:{{ iconRadius }}; background:{{ grad135 }}; display:flex; align-items:center; justify-content:center; font-size:22px;\">👻<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px; font-weight:800; margin:0 0 8px;\">Ghost mode, anytime.<\u002Fh3>\n          <p style=\"font-size:14.5px; color:#b7aec3; line-height:1.6; margin:0;\">Keep working your shift without appearing anywhere in the app. Visibility is always your choice.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"padding:32px; border-radius:{{ cardRadius }}; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:20px; opacity:0; transform:translateY(30px); transition:opacity .7s ease .2s, transform .7s ease .2s;\">\n        <div style=\"width:48px; height:48px; flex-shrink:0; border-radius:{{ iconRadius }}; background:{{ grad135 }}; display:flex; align-items:center; justify-content:center; font-size:22px;\">🍸<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px; font-weight:800; margin:0 0 8px;\">It's about the work.<\u002Fh3>\n          <p style=\"font-size:14.5px; color:#b7aec3; line-height:1.6; margin:0;\">OnTap celebrates bartenders as the draw, not just the venue.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HOW IT WORKS -->\n  <div id=\"how\" style=\"padding:120px 64px; background:linear-gradient(180deg, rgba(139,59,255,0.06), transparent);\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div style=\"text-align:center; max-width:640px; margin:0 auto 80px;\">\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">HOW IT WORKS<\u002Fdiv>\n        <h2 style=\"font-size:44px; font-weight:800; letter-spacing:-0.02em; margin:0;\">Three taps to your next favorite bar<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:48px;\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div data-reveal=\"\" style=\"text-align:center; opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease; transition-delay:calc({{ $index }} * 120ms);\">\n            <div style=\"width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:0 auto 24px; color:{{ tintColor }}; transition:transform .3s ease;\" style-hover=\"transform:scale(1.12);\">{{ s.n }}<\u002Fdiv>\n            <h3 style=\"font-size:19px; font-weight:700; margin:0 0 10px;\">{{ s.title }}<\u002Fh3>\n            <p style=\"font-size:15px; color:#b7aec3; line-height:1.6; margin:0; max-width:280px; margin-inline:auto;\">{{ s.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- BARTENDER WAITLIST -->\n  <div id=\"bartender-waitlist\" style=\"padding:120px 64px; max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:64px;\">\n      <div>\n        <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">BARTENDERS<\u002Fdiv>\n        <h2 style=\"font-size:40px; font-weight:800; letter-spacing:-0.02em; margin:0 0 20px; line-height:1.15;\">Be a founding bartender<\u002Fh2>\n        <p style=\"font-size:17px; color:#b7aec3; line-height:1.65; margin:0;\">Claim your profile before we launch and be first in your city when OnTap goes live — plus first access to Ghost mode.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"padding:40px; border-radius:{{ cardRadius }}; background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.1); opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease;\">\n        <sc-if value=\"{{ bartenderJoined }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <span style=\"font-size:22px;\">🍸<\u002Fspan>\n            <span style=\"font-size:15px; font-weight:700;\">You're on the founding list. See you behind the bar.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ bartenderNotJoined }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ handleBartenderSubmit }}\" style=\"display:flex; flex-direction:column; gap:12px;\">\n            <input type=\"email\" required=\"\" value=\"{{ bartenderEmailValue }}\" sc-camel-on-change=\"{{ handleBartenderEmailChange }}\" placeholder=\"you@email.com\" style=\"padding:15px 18px; border-radius:{{ btnRadius }}; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:#f3eef7; font-size:15px; font-family:inherit;\">\n            <button type=\"submit\" style=\"padding:15px 26px; border-radius:{{ btnRadius }}; background:{{ grad90 }}; color:#fff; font-weight:700; font-size:15px; border:none; cursor:pointer;\">Claim my profile<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FAQ -->\n  <div id=\"faq\" style=\"padding:120px 64px; max-width:840px; margin:0 auto;\">\n    <div style=\"text-align:center; max-width:640px; margin:0 auto 64px;\">\n      <div style=\"font-size:13px; font-weight:700; letter-spacing:0.1em; color:{{ tintColor }}; margin-bottom:16px;\">FAQ<\u002Fdiv>\n      <h2 style=\"font-size:40px; font-weight:800; letter-spacing:-0.02em; margin:0;\">Good questions<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:16px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"4\">\n        <div style=\"padding:28px 32px; border-radius:{{ cardRadius }}; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);\">\n          <h3 style=\"font-size:17px; font-weight:700; margin:0 0 8px;\">{{ q.q }}<\u002Fh3>\n          <p style=\"font-size:15px; color:#b7aec3; line-height:1.6; margin:0;\">{{ q.a }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"padding:56px 64px; border-top:1px solid rgba(255,255,255,0.06);\">\n    <div style=\"max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:24px;\">\n      <img src=\"ca614293-aa3d-46c9-98b5-f36136b5dd6d\" alt=\"OnTap\" style=\"height:22px; width:auto; object-fit:contain; opacity:0.85;\">\n      <div style=\"display:flex; gap:32px;\">\n        <a href=\"#features\" style=\"color:#9a90a8; font-size:14px;\">Features<\u002Fa>\n        <a href=\"#bartenders\" style=\"color:#9a90a8; font-size:14px;\">For bartenders<\u002Fa>\n        <a href=\"#how\" style=\"color:#9a90a8; font-size:14px;\">How it works<\u002Fa>\n        <a href=\"#faq\" style=\"color:#9a90a8; font-size:14px;\">FAQ<\u002Fa>\n        <a href=\"mailto:hello@whosontap.com\" style=\"color:#9a90a8; font-size:14px;\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"color:#6b6274; font-size:13px;\">© 2026 OnTap. Coming soon.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;cities&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;ST. LOUIS, MIAMI, CHICAGO, DENVER, NASHVILLE, PHOENIX&quot;, &quot;tsType&quot;: &quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { email: '', joined: false, bartenderEmail: '', bartenderJoined: false };\n\n  handleEmailChange = (e) => this.setState({ email: e.target.value });\n  handleSubmit = (e) => { e.preventDefault(); if (this.state.email) this.setState({ joined: true }); };\n  handleBartenderEmailChange = (e) => this.setState({ bartenderEmail: e.target.value });\n  handleBartenderSubmit = (e) => { e.preventDefault(); if (this.state.bartenderEmail) this.setState({ bartenderJoined: true }); };\n\n  revealRoot = (el) => {\n    if (!el       bartenderJoined: this.state.bartenderJoined,\n      bartenderNotJoined: !this.state.bartenderJoined,\n      bartenderEmailValue: this.state.bartenderEmail,\n      handleBartenderEmailChange: this.handleBartenderEmailChange,\n      handleBartenderSubmit: this.handleBartenderSubmit,\n      grad90,\n      grad90Smooth,\n      grad135,\n      gradCtaPanel: `linear-gradient(135deg,${th.dark1},${th.dark2})`,\n      tintColor: th.tint,\n      phoneGlow: `0 40px 100px rgba(${th.rgb1},0.25), 0 0 0 1px rgba(255,255,255,0.04)`,\n      blobA: `radial-gradient(circle, rgba(${th.rgb1},${en.op1}), transparent 70%)`,\n      blobB: `radial-gradient(circle, rgba(${th.rgb2},${en.op2}), transparent 70%)`,\n      floatAnim: `floatSlow ${en.dur} ease-in-out infinite`,\n      cardRadius: sh.card,\n      iconRadius: sh.icon,\n      phoneRadius: sh.phone,\n      panelRadius: sh.panel,\n      btnRadius: sh.btn,\n      pillRadius: sh.pill,\n      cityList: (this.props.cities ?? 'ST. LOUIS, MIAMI, CHICAGO, DENVER, NASHVILLE, PHOENIX').split(',').map(c => c.trim()),\n      customerFeatures: [\n        { icon: '🔍', title: 'Discover who\\'s on shift', desc: 'See bartenders and bars near you — who\\'s working tonight, right now.' },\n        { icon: '❤️', title: 'Follow your favorites', desc: 'Get notified the moment they go on shift, so you always know where to go.' },\n        { icon: '💸', title: 'Tip your bartender', desc: 'Show appreciation directly and cashless — no fumbling for cash.' },\n        { icon: '🗺️', title: 'The live map', desc: 'See who\\'s on shift around you at a glance, from anywhere in the city.' },\n      ],\n      bartenderFeatures: [\n        { icon: '✨', title: 'Get discovered', desc: 'Go on shift and nearby fans can find you instantly.' },\n        { icon: '👥', title: 'Build a following', desc: 'Regulars follow you and keep coming back, shift after shift.' },\n        { icon: '💵', title: 'Get tipped directly', desc: 'Cashless tips, straight to you — keep more of wha
